name: Compilar calculadora

on:
  push:
    branches: [ main ]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar
        run: javac -d out Calculadora.java
      - name: Ejecutar
        run: java -cp out Calculadora